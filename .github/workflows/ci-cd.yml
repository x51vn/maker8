name: Maker8 Video Render Worker CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build:
    name: Maker8 - Build and Test
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then pip install -e .; fi
          pip install pytest pytest-cov

      - name: Validate Dockerfile
        run: |
          if [ ! -f Dockerfile ]; then
            echo "ERROR: Dockerfile not found in repository root"
            exit 1
          fi
          echo "✓ Dockerfile exists and is readable"

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 src/maker8 --count --select=E9,F63,F7,F82 --show-source --statistics
          echo "✓ Flake8 linting passed"

      - name: Run tests with pytest
        run: |
          if [ -d tests/ ]; then
            pytest tests/ -v --tb=short
            echo "✓ pytest tests passed"
          else
            echo "⚠ No tests/ directory found, skipping pytest"
          fi

      - name: Type checking with mypy
        run: |
          pip install mypy
          mypy src/maker8 --ignore-missing-imports
          echo "✓ mypy type checking passed"

  build-and-push:
    name: Maker8 - Build, Tag & Push Docker Image
    runs-on: self-hosted
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      DEPLOYMENT_REPO: x51vn/deployment
      DEPLOYMENT_REPO_PAT: ""
      IMAGE_VERSION: ${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Import host env var to Actions context
        run: |
          echo "DOCKER_REGISTRY_USER=$DOCKER_REGISTRY_USER" >> $GITHUB_ENV
          echo "DOCKER_REGISTRY_PASSWORD=$DOCKER_REGISTRY_PASSWORD" >> $GITHUB_ENV
          echo "DEPLOY_USER=$DEPLOY_USER" >> $GITHUB_ENV
          echo "DEPLOY_HOST=$DEPLOY_HOST" >> $GITHUB_ENV
          echo "DEPLOYMENT_REPO_PAT=$GITHUB_PAT" >> $GITHUB_ENV
          echo "DOCKER_REGISTRY_HOST=$DOCKER_REGISTRY_HOST" >> $GITHUB_ENV

      - name: Validate required environment variables
        run: |
          required_vars=("DOCKER_REGISTRY_HOST" "DOCKER_REGISTRY_USER" "DOCKER_REGISTRY_PASSWORD" "DEPLOY_USER" "DEPLOY_HOST")
          for var in "${required_vars[@]}"; do
            if [ -z "${!var}" ]; then
              echo "ERROR: Required environment variable $var is not set"
              exit 1
            fi
          done
          echo "✓ All required environment variables are set"

      - name: Set image version
        run: |
          echo "IMAGE_VERSION=$(date +'%Y%m%d.%H%M')" >> $GITHUB_ENV
          echo "✓ Image version set to: ${{ env.IMAGE_VERSION }}"

      - name: Build Docker image
        run: |
          docker build -t $DOCKER_REGISTRY_HOST/x-ai/maker8:${{ env.IMAGE_VERSION }} .

      - name: Login to Docker Registry
        run: echo "$DOCKER_REGISTRY_PASSWORD" | docker login "$DOCKER_REGISTRY_HOST" -u "$DOCKER_REGISTRY_USER" --password-stdin

      - name: Push Docker image
        run: |
          docker tag $DOCKER_REGISTRY_HOST/x-ai/maker8:${{ env.IMAGE_VERSION }} $DOCKER_REGISTRY_HOST/x-ai/maker8:latest
          docker push $DOCKER_REGISTRY_HOST/x-ai/maker8:${{ env.IMAGE_VERSION }}
          docker push $DOCKER_REGISTRY_HOST/x-ai/maker8:latest

      - name: Checkout deployment repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DEPLOYMENT_REPO }}
          token: ${{ env.DEPLOYMENT_REPO_PAT }}
          path: deployment-repo

      - name: Update deployment files
        run: |
          sed -i "s|<registry>/<org>/maker8:[^ ]*|<registry>/<org>/maker8:${{ env.IMAGE_VERSION }}|g" deployment-repo/worker-z440/docker-compose.yml

          # Verify the image tag was updated correctly
          if ! grep -q "<registry>/<org>/maker8:${{ env.IMAGE_VERSION }}" deployment-repo/worker-z440/docker-compose.yml; then
            echo "ERROR: Failed to update maker8 image tag"
            grep -n -A 5 -B 5 "maker8:" deployment-repo/worker-z440/docker-compose.yml
            exit 1
          fi
          echo "✓ Updated maker8 image tag to ${{ env.IMAGE_VERSION }}"
          
          cd deployment-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add worker-z440/docker-compose.yml
          git commit -m "ci: update maker8 image to ${{ env.IMAGE_VERSION }} [skip ci]" || echo "No changes to commit"
          git push

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_HOST "
            cd /home/$DEPLOY_USER/deployment/worker-z440 &&
            git checkout master &&
            
            # Reset any local changes to avoid conflicts
            git fetch origin &&
            git reset --hard origin/master &&
            
            echo 'Validating YAML syntax before deployment...' &&
            if ! docker compose config > /dev/null 2>&1; then
              echo '✗ ERROR: YAML syntax validation failed' &&
              docker compose config 2>&1 | head -20 &&
              exit 1
            fi &&
            echo '✓ YAML syntax is valid' &&
            
            docker compose pull maker8 &&
            docker compose up -d maker8 &&
            echo 'Deployment completed, verifying container health...'
          "

      - name: Verify deployment health
        run: |
          echo "Waiting 10 seconds for container to stabilize..."
          sleep 10
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_HOST "
            CONTAINER_STATUS=\$(docker inspect --format='{{.State.Status}}' maker8-render-worker 2>/dev/null || echo 'missing')
            if [ \"\$CONTAINER_STATUS\" = \"running\" ]; then
              echo '✓ Container maker8 is running successfully'
              docker compose -f /home/$DEPLOY_USER/deployment/worker-z440/docker-compose.yml logs maker8 --tail=20
              exit 0
            else
              echo '✗ Container maker8 failed to start or exited (status: '\"\$CONTAINER_STATUS\"')'
              docker compose -f /home/$DEPLOY_USER/deployment/worker-z440/docker-compose.yml logs maker8 --tail=50
              exit 1
            fi
          "
