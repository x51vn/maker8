version: "3.9"

services:
  # ── Infrastructure ───────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: "maker8-local-dev-cluster"

  # ── Render Worker ──────────────────────────────────────────────
  render-worker:
    build: .
    depends_on:
      - kafka
    env_file:
      - .env
    environment:
      MAKER8_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MAKER8_KAFKA_GROUP_ID: maker8-render
      MAKER8_DROPBOX_APP_KEY: ${DROPBOX_APP_KEY:-}
      MAKER8_DROPBOX_APP_SECRET: ${DROPBOX_APP_SECRET:-}
      MAKER8_DROPBOX_REFRESH_TOKEN: ${DROPBOX_REFRESH_TOKEN:-}
      MAKER8_TTS_PROVIDER: ${TTS_PROVIDER:-gtts}
      MAKER8_ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      MAKER8_GOOGLE_CLOUD_TTS_ENABLED: ${GOOGLE_CLOUD_TTS_ENABLED:-false}
      MAKER8_LOG_LEVEL: INFO
      MAKER8_LOG_FORMAT: json
    volumes:
      - render-data:/data/maker8

volumes:
  render-data:
