version: "3.9"

services:
  # ── Infrastructure ───────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: "maker8-local-dev-cluster"

  # ── Render Worker ──────────────────────────────────────────────
  maker8:
    image: ${MAKER8_IMAGE:-docker.x51.vn/x-ai/maker8:latest}
    container_name: maker8-render-worker
    restart: unless-stopped
    depends_on:
      - kafka
    env_file:
      - .env
    environment:
      MAKER8_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MAKER8_KAFKA_GROUP_ID: maker8-render
      MAKER8_DROPBOX_APP_KEY: ${DROPBOX_APP_KEY:-}
      MAKER8_DROPBOX_APP_SECRET: ${DROPBOX_APP_SECRET:-}
      MAKER8_DROPBOX_REFRESH_TOKEN: ${DROPBOX_REFRESH_TOKEN:-}
      MAKER8_TTS_PROVIDER: ${TTS_PROVIDER:-gtts}
      MAKER8_ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      MAKER8_GOOGLE_CLOUD_TTS_ENABLED: ${GOOGLE_CLOUD_TTS_ENABLED:-false}
      MAKER8_LOG_LEVEL: INFO
      MAKER8_LOG_FORMAT: json
    volumes:
      - render-data:/data/maker8
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "1"
          memory: 2G
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import os; exit(0 if os.path.exists('/tmp/maker8_healthy') else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      app: "maker8"
      service: "render-worker"
      version: "${MAKER8_VERSION:-latest}"

volumes:
  render-data:
