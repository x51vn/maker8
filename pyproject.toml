[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maker8"
version = "0.1.0"
description = "Maker8 – Video Render Pipeline Worker"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "confluent-kafka>=2.3,<3.0",
    "moviepy>=2.0,<3.0",
    "yt-dlp>=2024.0",
    "dropbox>=12.0,<13.0",
    "Pillow>=10.0",
    "structlog>=24.0",
    "gTTS>=2.5,<3.0",
    "google-cloud-texttospeech>=2.16,<3.0",
    "elevenlabs>=1.0,<2.0",
    "requests>=2.31,<3.0",
    "numpy>=1.24",
    "prometheus-client>=0.20",
    "psycopg2-binary>=2.9,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
maker8 = "maker8.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/maker8", "src/render_contracts"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
